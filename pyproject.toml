[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numerical-experiment-manager"
version = "0.1.0"
description = "Reproducible wall-clock management of Python numerical/ML experiments (baseline, early stopping, reports, tuning)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
demo = ["torch>=1.10", "matplotlib>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
