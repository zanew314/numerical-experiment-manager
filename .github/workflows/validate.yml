name: Validate skill

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Scripts and tests (standard library only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile the scripts
        run: python -m py_compile scripts/*.py
      - name: Run the unit tests
        run: python -m unittest discover -s tests -v
      - name: Run the smoke test
        run: python .github/smoke_test.py
