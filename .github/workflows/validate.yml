name: Validate skill

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (numpy only, zero skips)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the required dependency
        run: python -m pip install "numpy>=1.21"
      - name: Run dependency-free tests with zero skips
        run: |
          python -m unittest -v \
            tests.test_code_reader \
            tests.test_early_stopper \
            tests.test_experiment_runner \
            tests.test_injector \
            tests.test_llm_analyzer \
            tests.test_loss_stream \
            tests.test_no_stream_runner \
            tests.test_param_tuner \
            tests.test_result_analyzer \
            tests.test_poisson_traditional \
            tests.test_cli_scripts

  demos:
    name: Full suite with CPU PyTorch (opt-in integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install demo dependencies (CPU torch)
        run: |
          python -m pip install "numpy>=1.21" "matplotlib>=3.5"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the full suite with zero skips
        env:
          NEMS_RUN_INTEGRATION: "1"
        run: python -m unittest discover -s tests -v
